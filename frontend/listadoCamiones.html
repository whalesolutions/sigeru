<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Camiones - SiGeRU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/stylesLogin.css">
</head>

<body class="login-body">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-11">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">

                    <!-- Encabezado -->
                    <div class="card-header bg-success text-white p-4">
                        <div class="d-flex flex-column flex-md-row
                            justify-content-between align-items-md-center gap-3">

                            <div>
                                <h1 class="h3 mb-1">
                                    <i class="bi bi-truck me-2"></i>
                                    Listado de Camiones
                                </h1>

                                <p class="mb-0 opacity-75">
                                    Consulta de los vehículos registrados en el sistema.
                                </p>
                            </div>
                            <a href="dashboard.html" class="btn btn-light flex-shrink-0">
                                <i class="bi bi-arrow-left me-1"></i>
                                Volver
                            </a>
                        </div>
                    </div>

                    <!-- Contenido -->
                    <div class="card-body p-4 p-md-5">

                        <!-- Buscador -->
                        <div class="card border-success mb-4">
                            <div class="card-header bg-light">
                                <h2 class="h5 mb-0">
                                    <i class="bi bi-search text-success me-2"></i>
                                    Buscar camión
                                </h2>
                            </div>

                            <div class="card-body">
                                <label for="buscador" class="form-label">
                                    Matrícula, marca, modelo o estado
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-search"></i>
                                    </span>

                                    <input type="search" id="buscador" class="form-control"
                                        placeholder="Ej.: STC1234, JAC, N900 o Activo" autocomplete="off">
                                </div>

                                <div class="form-text">
                                    Los resultados se filtran a medida que escribe.
                                </div>
                            </div>
                        </div>

                        <!-- Mensaje -->
                        <div id="mensajeCamiones" class="alert alert-info d-none" role="alert">
                        </div>

                        <!-- Tabla donde se muestra la info basica del Camion-->
                        <div class="card border-success">

                            <div class="card-header bg-light
                                d-flex justify-content-between align-items-center">

                                <h2 class="h5 mb-0">
                                    <i class="bi bi-list-ul text-success me-2"></i>
                                    Camiones registrados
                                </h2>
                            </div>

                            <div class="table-responsive">
                                <table class="table table-striped table-hover
                                    align-middle mb-0">

                                    <thead class="table-success">
                                        <tr>
                                            <th scope="col">
                                                Matrícula
                                            </th>

                                            <th scope="col">
                                                Marca
                                            </th>

                                            <th scope="col">
                                                Modelo
                                            </th>

                                            <th scope="col">
                                                Estado
                                            </th>

                                            <th scope="col" class="text-center">
                                                Acciones
                                            </th>
                                        </tr>
                                    </thead>

                                    <tbody id="tablaCamiones">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Modal de detalle muestra la info del camion al abrir un popup detallando -->
    <div class="modal fade" id="modalCamion" tabindex="-1" aria-labelledby="modalCamionLabel" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-success text-white">
                    <h2 class="modal-title fs-5" id="modalCamionLabel">
                        <i class="bi bi-truck me-2"></i>
                        Detalle del camión
                    </h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar">
                    </button>
                </div>

                <div class="modal-body p-4">
                    <div class="row border-bottom py-2">
                        <div class="col-5">
                            <strong>Matrícula:</strong>
                        </div>
                        <div class="col-7" id="detalleMatricula">
                        </div>
                    </div>
                    <div class="row border-bottom py-2">
                        <div class="col-5">
                            <strong>Marca:</strong>
                        </div>
                        <div class="col-7" id="detalleMarca">
                        </div>
                    </div>
                    <div class="row border-bottom py-2">
                        <div class="col-5">
                            <strong>Modelo:</strong>
                        </div>
                        <div class="col-7" id="detalleModelo">
                        </div>
                    </div>
                    <div class="row border-bottom py-2">
                        <div class="col-5">
                            <strong>Capacidad:</strong>
                        </div>
                        <div class="col-7" id="detalleCapacidad">
                        </div>
                    </div>
                    <div class="row border-bottom py-2">
                        <div class="col-5">
                            <strong>Kilometraje:</strong>
                        </div>
                        <div class="col-7" id="detalleKilometraje">
                        </div>
                    </div>
                    <div class="row py-2">
                        <div class="col-5">
                            <strong>Estado:</strong>
                        </div>

                        <div class="col-7" id="detalleEstado">
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                        <i class="bi bi-x-lg me-1"></i>
                        Cerrar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/camiones.js?v=6"></script>

</body>

</html>
