<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Camiones - SiGeRU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <main class="container mt-4">
        <a href="dashboard.html" class="btn btn-outline-secondary mb-3">
            Volver al dashboard
        </a>
        <h1 class="h2 mb-4">
            Listado de Camiones
        </h1>

        <div class="mb-3">
            <label for="buscador" class="form-label">
                Buscar camión
            </label>
            <input type="text" id="buscador" class="form-control"
                placeholder="Buscar por matrícula, marca, modelo o estado">
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Matrícula</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaCamiones">
                </tbody>
            </table>
        </div>
        <div id="mensajeCamiones" class="alert alert-info d-none" role="alert"> 

        </div>
    </main>

    <!-- Modal (ventana) que detalla la info del camion -->
    <div class="modal fade" id="modalCamion" tabindex="-1" aria-labelledby="modalCamionLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="modalCamionLabel">
                        Detalle del camión
                    </h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar">
                    </button>
                </div>

                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-5">
                            <strong>Matrícula:</strong>
                        </div>
                        <div class="col-7" id="detalleMatricula">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-5">
                            <strong>Marca:</strong>
                        </div>
                        <div class="col-7" id="detalleMarca">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-5">
                            <strong>Modelo:</strong>
                        </div>
                        <div class="col-7" id="detalleModelo">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-5">
                            <strong>Capacidad de carga:</strong>
                        </div>
                        <div class="col-7" id="detalleCapacidad">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-5">
                            <strong>Kilometraje:</strong>
                        </div>
                        <div class="col-7" id="detalleKilometraje">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-5">
                            <strong>Estado:</strong>
                        </div>
                        <div class="col-7" id="detalleEstado">
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/camiones.js?v=5"></script>

</body>

</html>
