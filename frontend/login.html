<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso SiGeRU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/stylesLogin.css">


</head>

<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <img src="assets/images/SiGeRU.png" class="login-logo" alt="Logo SiGeRU">
            <h2>
                Iniciar sesión
            </h2>
            <p class="text-muted">
                Accedé al Sistema Nacional de Gestión de Residuos Urbanos
            </p>

            <form id="loginForm">
                <!-- Usuario -->
                <div class="mb-3">
                    <label class="form-label">
                        Correo electrónico
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control" name="email" placeholder="correo@email.com" required>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="mb-3">
                    <label class="form-label">
                        Contraseña
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input type="password" class="form-control" name="password" placeholder="Ingrese su contraseña"
                            required>
                    </div>
                </div>

                <!-- Recordar -->
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="recordar">
                    <label class="form-check-label" for="recordar">
                        Recordar sesión
                    </label>
                </div>

                <!-- Botón -->
                <button type="submit" class="btn btn-success w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Ingresar
                </button>
                <div>
                    <p id="mensajeLogin"></p>
                </div>

            </form>
            <div class="mt-4">
                <a href="#" class="login-link">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>
            <hr>
            <a href="index.html" class="btn btn-outline-success w-100">
                Volver al inicio
            </a>

        </div>
    </div>
    <script src="js/login.js"></script>

</body>

</html>
