<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SiGeRU | Listado de Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="card border-0 shadow">

            <div class="card-header bg-success text-white py-3">

                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h2 class="mb-1">
                            Listado de Usuarios
                        </h2>

                        <small>
                            Consulta de usuarios registrados en SiGeRU
                        </small>
                    </div>

                    <a href="dashboard.html" class="btn btn-light">
                        <i class="bi bi-arrow-left me-1"></i>
                        Volver
                    </a>

                </div>

            </div>

            <div class="card-body">

                <div class="row mb-4">

                    <div class="col-md-7">

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-search"></i>
                            </span>

                            <input type="text" class="form-control" id="buscarUsuario"
                                placeholder="Buscar por nombre, documento o correo">

                        </div>

                    </div>

                    <div class="col-md-5 text-md-end mt-3 mt-md-0">

                        <span class="badge bg-success fs-6 px-3 py-2">
                            Total:
                            <span id="totalUsuarios">0</span>
                        </span>

                    </div>

                </div>

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-success">

                            <tr>
                                <th>Documento</th>
                                <th>Nombre completo</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th class="text-center">Acción</th>
                            </tr>

                        </thead>

                        <tbody id="tablaUsuarios">

                            <!-- Las filas se generan desde JavaScript -->

                        </tbody>

                    </table>

                </div>

                <div id="mensajeUsuarios" class="alert alert-info text-center mt-3 d-none">
                    No se encontraron usuarios.
                </div>

            </div>

            <div class="card-footer bg-white text-center text-muted">

                Sistema de Gestión de Residuos Urbanos

            </div>

        </div>

    </div>

    <!-- Modal de detalle que muestra la info detallad del usuario -->

    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="tituloModalUsuario" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header bg-success text-white">

                    <h5 class="modal-title" id="tituloModalUsuario">
                        <i class="bi bi-person-circle me-2"></i>
                        Información del usuario
                    </h5>

                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>

                </div>

                <div class="modal-body">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <small class="text-muted">ID</small>
                            <p class="fw-semibold mb-0" id="modalId"></p>
                        </div>

                        <div class="col-md-6">
                            <small class="text-muted">Documento</small>
                            <p class="fw-semibold mb-0" id="modalDocumento"></p>
                        </div>

                        <div class="col-md-6">
                            <small class="text-muted">Nombre</small>
                            <p class="fw-semibold mb-0" id="modalNombre"></p>
                        </div>

                        <div class="col-md-6">
                            <small class="text-muted">Apellido</small>
                            <p class="fw-semibold mb-0" id="modalApellido"></p>
                        </div>

                        <div class="col-md-6">
                            <small class="text-muted">Teléfono</small>
                            <p class="fw-semibold mb-0" id="modalTelefono"></p>
                        </div>

                        <div class="col-md-6">
                            <small class="text-muted">Rol</small>
                            <p class="fw-semibold mb-0" id="modalRol"></p>
                        </div>

                        <div class="col-12">
                            <small class="text-muted">Correo electrónico</small>
                            <p class="fw-semibold mb-0" id="modalCorreo"></p>
                        </div>

                        <div class="col-12">
                            <small class="text-muted">Estado</small>
                            <div class="mt-1">
                                <span id="modalEstado" class="badge"></span>
                            </div>
                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cerrar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/listadoUsuario.js"></script>

</body>

</html>
