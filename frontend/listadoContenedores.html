<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listado de Contenedores - SiGeRU</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <main class="container mt-4">

        <a href="dashboard.html" class="btn btn-outline-secondary mb-3">
            Volver al dashboard
        </a>

        <h1 class="h2 mb-4">
            Listado de Contenedores
        </h1>

        <div class="mb-3">

            <label for="buscadorContenedores" class="form-label">
                Buscar contenedor
            </label>

            <input type="text" id="buscadorContenedores" class="form-control"
                placeholder="Buscar por código, dirección o estado">

        </div>

        <div class="table-responsive">

            <table class="table table-striped table-hover align-middle">

                <thead class="table-dark">

                    <tr>
                        <th>Código</th>
                        <th>Dirección</th>
                        <th>Capacidad</th>
                        <th>Estado</th>
                        <th class="text-center">Acción</th>
                    </tr>

                </thead>

                <tbody id="tablaContenedores">
                </tbody>

            </table>

        </div>

        <div id="mensajeContenedores" class="alert alert-info d-none" role="alert">
        </div>

    </main>

    <!-- Modal que muestra la información completa del contenedor -->

    <div class="modal fade" id="modalContenedor" tabindex="-1" aria-labelledby="modalContenedorLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h2 class="modal-title fs-5" id="modalContenedorLabel">
                        Detalle del contenedor
                    </h2>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="row mb-3">

                        <div class="col-5">
                            <strong>Código:</strong>
                        </div>

                        <div class="col-7" id="detalleCodigo">
                        </div>

                    </div>

                    <div class="row mb-3">

                        <div class="col-5">
                            <strong>Dirección:</strong>
                        </div>

                        <div class="col-7" id="detalleDireccion">
                        </div>

                    </div>

                    <div class="row mb-3">

                        <div class="col-5">
                            <strong>Capacidad:</strong>
                        </div>

                        <div class="col-7" id="detalleCapacidadContenedor">
                        </div>

                    </div>

                    <div class="row mb-3">

                        <div class="col-5">
                            <strong>Fecha de instalación:</strong>
                        </div>

                        <div class="col-7" id="detalleFechaInstalacion">
                        </div>

                    </div>

                    <div class="row mb-3">

                        <div class="col-5">
                            <strong>Latitud:</strong>
                        </div>

                        <div class="col-7" id="detalleLatitud">
                        </div>

                    </div>

                    <div class="row mb-3">

                        <div class="col-5">
                            <strong>Longitud:</strong>
                        </div>

                        <div class="col-7" id="detalleLongitud">
                        </div>

                    </div>

                    <div class="row mb-3">

                        <div class="col-5">
                            <strong>Estado:</strong>
                        </div>

                        <div class="col-7" id="detalleEstadoContenedor">
                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cerrar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/contenedores.js?v=1"></script>

</body>

</html>
